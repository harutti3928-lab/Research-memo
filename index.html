<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubの使い方メモ</title>
    <style>
      /* 全体のリセットと共通設定 */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: #fcfbfa; /* わずかに温かみのある、上質な書籍の紙のようなオフホワイト */
        color: #2c2a29; /* 完全に真っ黒ではない、目に優しいトナー（墨色） */
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "YakuHanJPs", "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", Meiryo, sans-serif;
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
      }

      /* タイトルや見出し用の洗練されたローマン・明朝体フォント */
      .font-serif {
        font-family: "Times New Roman", "Georgia", "Noto Serif JP", "BIZ UDPMincho", serif;
      }

      /* ヘッダーデザイン（シンプルで余白を活かした知的な構成） */
      header {
        max-width: 740px;
        margin: 0 auto;
        padding: 80px 24px 40px 24px;
        text-align: center;
        border-bottom: 1px solid #e6e4e0;
      }

      header h1 {
        font-size: 24pt;
        font-weight: 600;
        letter-spacing: 2px;
        margin: 0 0 12px 0;
        color: #1a1919;
      }

      header p {
        font-size: 10pt;
        color: #73706c;
        margin: 0;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* メインコンテンツエリア */
      main {
        max-width: 740px;
        margin: 0 auto;
        padding: 60px 24px 100px 24px;
      }

      /* セクション見出し（ミニマルで美しいアンダーライン） */
      h2 {
        font-size: 14pt;
        font-weight: 600;
        color: #2c2a29;
        margin-top: 0;
        margin-bottom: 32px;
        letter-spacing: 1px;
        position: relative;
        display: inline-block;
      }
      
      h2::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 0;
        width: 100%;
        height: 1px;
        background-color: #2c2a29;
      }

      /* リストとリンクのデザイン（シンプルでありながら心地よいインタラクション） */
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        margin-bottom: 24px;
        border-bottom: 1px solid #f0ede9;
        padding-bottom: 16px;
      }

      li:last-child {
        border-bottom: none;
      }

      /* リンク：静かで美しい佇まい。ホバー時に知的なブルーへ変化 */
      li a {
        display: block;
        color: #1a1a1a;
        text-decoration: none;
        font-size: 11.5pt;
        font-weight: 500;
        transition: color 0.25s ease;
      }

      /* マウスホバー時の挙動 */
      li a:hover {
        color: #4a69b5; /* 知性を感じさせる落ち着いたブルーグレー */
      }

      /* フッター（学術ブログの美しい静寂感を演出） */
      footer {
        max-width: 740px;
        margin: 0 auto;
        padding: 40px 24px;
        border-top: 1px solid #e6e4e0;
        text-align: center;
        font-size: 8.5pt;
        color: #96938f;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>

    <header>
      <h1 class="font-serif">GitHubの使い方メモ</h1>
      <p class="font-serif">— Personal Reference Center —</p>
    </header>

    <main>
      <h2 class="font-serif">ページ一覧</h2>
      
      <ul>
        <li><a href="github-basics.html">GitHubの基本（とは・設定・よく使う操作・用語）</a></li>
        <li><a href="github-repo.html">GitHubリポジトリの見方</a></li>
        <li><a href="cursor-to-pages.html">CursorからGitHub Pages公開までの流れ</a></li>
        <li><a href="html-guide.html">HTMLの書き方まとめ</a></li>
        <li><a href="shortcuts.html">便利なショートカット一覧</a></li>
        <li><a href="css-guide.html">CSSについて</a></li>
        <li><a href="markdown-guide.html">Markdownの書き方と .md ファイルの役割</a></li>
      </ul>
    </main>

    <footer>
      <p class="font-serif">&copy; 2026 GitHubの使い方メモ. Powered by Simplicity & Intelligence.</p>
    </footer>

  </body>
</html>
